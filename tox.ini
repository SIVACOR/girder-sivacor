[tox]
envlist =
    lint,
    test

[testenv]
basepython = python3
package = wheel
wheel_build_env = .pkg

[testenv:test]
deps =
    pytest
    pytest-girder>=5.0.0a1
    pytest-cov
    pytest-asyncio
    pytest-xdist
    redis[hiredis]
    mock
    coverage[toml]
passenv =
    DOCKER_HOST
    GIRDER_*
    CI
    GITHUB_*
    STATA_LICENSE_HOSTPATH
# Parallelism, because most of the serial wall clock is waiting on docker and
# mongo rather than computing. Pinned rather than `auto` so CI and a workstation
# do not silently run different shapes -- but the number is now a floor for the
# smallest machine that runs this, not an optimum.
#
# DEFAULT 4, sized for CI: .github/workflows/test.yml runs on ubuntu-latest,
# which is a 4-vCPU runner. Raising the default would oversubscribe it and, worse,
# hit the fd limit described below on a services container we cannot pass flags to.
#
# RAISE IT LOCALLY: export PYTEST_XDIST_N=16, or pass `-- -n 16` (a later -n in
# posargs wins). Measured 2026-08-21 on a 32-thread i9-14900KF / 62 GB / NVMe,
# 508 tests, all widths green:
#
#     -n 0    537s      -n 8    66s       -n 24   49s
#     -n 4    122-132s  -n 16   49-53s    -n 32   50s   (4 runs at n=16)
#
# So the gain flattens at 16-24, ~2.5x faster than -n 4 -- NOT at 4. The previous
# note here claimed "115s at both -n 4 and -n 8", which was measured on a laptop
# and does not hold on this hardware; -n 8 alone is 1.9x faster than -n 4. It also
# blamed docker contention for the timing assertions in test_orphan_cleanup.py
# being fragile: no failure appeared at any width, including four consecutive runs
# at -n 16. Treat that caution as unreproduced rather than disproved -- flakiness
# is probabilistic and four runs is not a stress test.
#
# ONE HARD CEILING, and it is mongo, not CPU or docker. pytest-girder gives every
# test its own database, so a wide run opens hundreds of WiredTiger files at once.
# At -n 16 against a mongo started the way CI_SETUP.md documents it, mongod hits
# its default 1024 fd limit and *aborts*: `Too many open files` ->
# `WT_PANIC` -> `fassert()` -> exit 14, taking the rest of the run with it. Start
# it with `--ulimit nofile=64000:64000` (MongoDB's own recommendation) before
# raising this. The `Too many index builds running simultaneously` line that
# appears alongside is INFO and benign -- it is mongo throttling, not the failure.
#
# Debugging one test: `-p no:xdist` or `-n 0` via posargs.
commands =
    pytest --verbose --strict --showlocals -n {env:PYTEST_XDIST_N:4} --cov={toxinidir}/girder_sivacor --cov-report=term-missing --cov-report=xml --cov-report=html {posargs}
changedir = tests

[testenv:lint]
skipsdist = true
skip_install = true
deps =
    ruff
commands =
    ruff check {posargs}

[tool:pytest]
addopts =
    --cov-report=term-missing
junit_family = xunit2
testpaths = tests
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
asyncio_mode = auto
