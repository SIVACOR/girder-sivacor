[tox]
envlist =
    lint,
    test

[testenv]
basepython = python3
package = wheel
wheel_build_env = .pkg

[testenv:test]
deps =
    pytest
    pytest-girder>=5.0.0a1
    pytest-cov
    pytest-asyncio
    pytest-xdist
    redis[hiredis]
    mock
    coverage[toml]
passenv =
    DOCKER_HOST
    GIRDER_*
    CI
    GITHUB_*
    STATA_LICENSE_HOSTPATH
# -n 4 cuts the suite from ~7.5min to ~2.5min: most of the serial wall clock is
# spent waiting on docker and mongo, not computing. Pinned rather than `auto`
# because the gain flattens at 4 (measured: 115s at both -n 4 and -n 8) while
# docker contention keeps growing -- and contention is what makes the timing
# assertions in test_orphan_cleanup.py fragile. Override with `-p no:xdist` or
# `-n 0` via posargs when debugging a single test.
commands =
    pytest --verbose --strict --showlocals -n 4 --cov={toxinidir}/girder_sivacor --cov-report=term-missing --cov-report=xml --cov-report=html {posargs}
changedir = tests

[testenv:lint]
skipsdist = true
skip_install = true
deps =
    ruff
commands =
    ruff check {posargs}

[tool:pytest]
addopts =
    --cov-report=term-missing
junit_family = xunit2
testpaths = tests
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
asyncio_mode = auto
