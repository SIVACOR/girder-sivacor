name: Docker Image

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tagging policy, mirrored from sivacor-autoscaler's CI for the reason that
      # workflow states: the immutable `sha-` tag is what lets a deployment pin, so
      # that merging to main stops being the same decision as deploying.
      #
      # This image pushed `latest` only until 2026-08-13, and both
      # docker-stack.yml and docker-stack.autoscaler.yml default to `latest` -- so
      # a merge here armed production. That was tolerable when this image was only
      # girder/beat/local_worker; it is not now that the fleet controller runs from
      # it too (worker_sizing_plan.md P0.5), because a bad controller costs
      # allocation in one direction and stalls submissions in the other.
      - name: Compute tags
        id: tags
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          tags="${branch},sha-${GITHUB_SHA::7}"
          [ "${GITHUB_REF}" = "refs/heads/main" ] && tags="${tags},latest"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "will push: ${tags}"

      - name: Build and push
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: xarthisius/girder-sivacor
          tags: ${{ steps.tags.outputs.tags }}
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          enableBuildKit: true
          multiPlatform: false

      # The action above exposes imageFullName/imageName/tags but no digest, so
      # ask the registry for it. This is the only ref that is immutable no matter
      # what later pushes do to `latest` or to the branch tag, so it is what a
      # post-mortem needs when the question is "which build is production
      # actually running".
      - name: Record image digest
        run: |
          ref="docker.io/xarthisius/girder-sivacor:sha-${GITHUB_SHA::7}"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          {
            echo "### Image pushed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tags | \`${{ steps.tags.outputs.tags }}\` |"
            echo "| digest | \`${digest}\` |"
            echo
            echo "Pin a deployment to this exact build with:"
            echo
            echo '```sh'
            echo "GIRDER_SIVACOR_IMAGE=docker.io/xarthisius/girder-sivacor@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Image digest::docker.io/xarthisius/girder-sivacor@${digest}"
